name: nightly-build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for release-please PR merged today
        id: check-release
        run: |
          MERGED=$(gh pr list \
            --state merged \
            --label "autorelease: tagged" \
            --base main \
            --json mergedAt \
            --jq '[.[] | select(.mergedAt > (now - 86400 | todate))] | length')
          echo "release_merged=$MERGED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if no release merged
        if: ${{ steps.check-release.outputs.release_merged == '0' }}
        run: |
          echo "No release-please PR merged in the last 24 hours, skipping nightly build."
          exit 0

      - name: Set up Docker Buildx
        if: ${{ steps.check-release.outputs.release_merged != '0' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ steps.check-release.outputs.release_merged != '0' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: ${{ steps.check-release.outputs.release_merged != '0' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly
            type=sha,prefix=nightly-

      - name: Build and push nightly
        if: ${{ steps.check-release.outputs.release_merged != '0' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JWT_SECRET=change-me-in-production
            BACKEND_URL=http://localhost:8000
